# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ════════════════════════════════════════════════════════════════════
# 1080p
# ════════════════════════════════════════════════════════════════════
$clock   = 180
$hour_y  = 300
$min_y   = 75
$day     = 30
$day_y   = -80
$user    = 100
$avatar  = 130
$user_y  = -180
$input   = 250, 60
$input_y = -290
$song    = 18
$song_y  = 60

# ---------------------- HDMI-A-1 ----------------------
# Hour-Time
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 185, 0, .6)
    font_size = $clock
    font_family = AlfaSlabOne
    position = 0, $hour_y
    halign = center
    valign = center
}
# Minute-Time
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, .6)
    font_size = $clock
    font_family = AlfaSlabOne
    position = 0, $min_y
    halign = center
    valign = center
}
# Day-Date-Month
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "<span color='##ffffff99'>$(date '+%A, ')</span><span color='##ffb90099'>$(date '+%d %B')</span>"
    font_size = $day
    font_family = SF Pro Display Bold
    position = 0, $day_y
    halign = center
    valign = center
}
# user-avatar
image {
    monitor = HDMI-A-1
    path = ~/.face.icon
    size = $avatar
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, $user_y
    halign = center
    valign = center
}
# user-avatar-fallback
label {
    monitor = HDMI-A-1
    text = cmd[update:10000] echo "$( [ -s "$HOME/.face.icon" ] || printf '<span> </span>' )"
    color = rgba(255, 255, 255, .65)
    font_size = $user
    font_family = JetBrainsMono Nerd Font
    position = 10, $user_y
    halign = center
    valign = center
}
# INPUT FIELD
input-field {
    monitor = HDMI-A-1
    size = $input
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Hi, $USER</span></i>
    hide_input = false
    position = 0, $input_y
    halign = center
    valign = center
}
# CURRENT SONG
label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = $song
    font_family = JetBrainsMono Nerd Font, SF Pro Display
    position = 0, $song_y
    halign = center
    valign = bottom
}

